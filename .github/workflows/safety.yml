# This workflow runs checks for unsafe code. In crates that don't have any unsafe code, this can be
# removed. Runs:
# - address sanitizer - detects memory errors
# - leak sanitizer - detects memory leaks
# - miri - detects undefined behavior and memory leaks
# - kani - verifies code snippets using model checking
# See check.yml for information about how the concurrency cancellation and workflow triggering works
permissions:
  contents: read
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: safety
env:
  KANI_VERSION: '0.67.0'
jobs:
  sanitize_x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
      - run: |
            # to get the symbolizer for debug symbol resolution
            sudo apt install llvm
            # to fix buggy leak analyzer:
            # https://github.com/japaric/rust-san#unrealiable-leaksanitizer
            # ensure there's a profile.dev section
            if ! grep -qE '^[ \t]*[profile.dev]' Cargo.toml; then
                echo >> Cargo.toml
                echo '[profile.dev]' >> Cargo.toml
            fi
            # remove pre-existing opt-levels in profile.dev
            sed -i '/^\s*\[profile.dev\]/,/^\s*\[/ {/^\s*opt-level/d}' Cargo.toml
            # now set opt-level to 1
            sed -i '/^\s*\[profile.dev\]/a opt-level = 1' Cargo.toml
            cat Cargo.toml
        name: Enable debug symbols
      - name: cargo test -Zsanitizer=address
        # only --lib --tests b/c of https://github.com/rust-lang/rust/issues/53945
        run: cargo test --lib --tests --all-features --target x86_64-unknown-linux-gnu
        env:
          ASAN_OPTIONS: "detect_odr_violation=0:detect_leaks=0"
          RUSTFLAGS: "-Z sanitizer=address"
      - name: cargo test -Zsanitizer=leak
        if: always()
        run: cargo test --all-features --target x86_64-unknown-linux-gnu
        env:
          LSAN_OPTIONS: "suppressions=lsan-suppressions.txt"
          RUSTFLAGS: "-Z sanitizer=leak"
  miri:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / miri
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v1
        with:
          crate: cargo-nextest
          locked: true
      - name: cargo miri test
        timeout-minutes: 120
        run: cargo miri nextest run
        env:
          MIRIFLAGS: ""
  kani_discover:
    name: Discover Kani proofs
    # ARM64 keeps the architecture-gated NEON proofs in discovery.
    runs-on: ubuntu-24.04-arm
    outputs:
      harnesses: ${{ steps.matrix.outputs.harnesses }}
    steps:
      - uses: actions/checkout@v4
      - name: List compiled Kani harnesses
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: ${{ env.KANI_VERSION }}
          args: list --format json
      - name: Build proof matrix
        id: matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("kani-list.json") as source:
              listing = json.load(source)
          kinds = ("standard-harnesses", "contract-harnesses")
          harnesses = sorted(
              name
              for kind in kinds
              for names in listing[kind].values()
              for name in names
          )
          expected = sum(listing["totals"][kind] for kind in kinds)
          if not harnesses or len(harnesses) != expected or len(set(harnesses)) != expected:
              raise SystemExit("Kani discovery returned an empty or inconsistent harness list")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("harnesses=" + json.dumps(harnesses), file=output)
          PY
  kani_proofs:
    name: kani / ${{ matrix.harness }}
    needs: kani_discover
    if: ${{ needs.kani_discover.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # Use the compiler's harness list so new and renamed proofs run automatically.
        harness: ${{ fromJSON(needs.kani_discover.outputs.harnesses) }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'cargo kani'
        timeout-minutes: 220
        uses: model-checking/kani-github-action@v1
        env:
          KANI_HARNESS: ${{ matrix.harness }}
        with:
          kani-version: ${{ env.KANI_VERSION }}
          args: --fail-fast --exact --harness "$KANI_HARNESS"
  kani:
    # Preserve the original check name and require every proof job to succeed.
    needs: [kani_discover, kani_proofs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all Kani proofs
        env:
          KANI_DISCOVERY_RESULT: ${{ needs.kani_discover.result }}
          KANI_RESULT: ${{ needs.kani_proofs.result }}
        run: test "$KANI_DISCOVERY_RESULT" = success && test "$KANI_RESULT" = success
